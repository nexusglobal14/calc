<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Nexus Global Calculators | calc.nexusglobalit.org</title>
    <meta name="description" content="Get in touch with the Nexus Global Calculators team for feedback, support, or inquiries.">
    <link rel="canonical" href="https://calc.nexusglobalit.org/contact.html">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="https://calc.nexusglobalit.org/" class="text-xl font-bold tracking-tight flex items-center gap-2">
                <span>🌐 Nexus Global</span> <span class="text-xs bg-indigo-700 px-2 py-0.5 rounded text-indigo-200">Calculators</span>
            </a>
            <a href="https://calc.nexusglobalit.org/" class="text-sm bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded transition">← Home</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-4 md:p-8 flex-grow">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            <h1 class="text-3xl font-extrabold text-slate-900 border-b pb-4">Contact Us</h1>
            <p class="text-slate-600 leading-relaxed">
                Have questions, suggestions, or feedback regarding our calculation tools? Fill out the form below and our team will get back to you!
            </p>

            <!-- Contact Form -->
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="space-y-4 max-w-xl">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Your Name</label>
                    <input type="text" name="name" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Your Email</label>
                    <input type="email" name="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Message</label>
                    <textarea name="message" rows="4" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 mt-auto border-t border-slate-800">
        <div class="max-w-5xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-sm">&copy; calc.nexusglobalit.org - All Rights Reserved.</p>
            <div class="flex gap-6 text-sm">
                <a href="https://calc.nexusglobalit.org/about.html" class="hover:text-white transition">About Us</a>
                <a href="https://calc.nexusglobalit.org/privacy-policy.html" class="hover:text-white transition">Privacy Policy</a>
                <a href="https://calc.nexusglobalit.org/contact.html" class="hover:text-white transition">Contact Us</a>
            </div>
        </div>
    </footer>
</body>
</html>
